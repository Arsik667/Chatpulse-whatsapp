server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # одностраничное приложение: неизвестные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # у файлов из сборки хеш в имени — их можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
